name: shop-dev

services:
  db:
    image: postgres:16-alpine
    container_name: shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
      POSTGRES_DB_TEST: shop_test
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: node:20-bookworm-slim
    container_name: shop-app
    profiles: ["app"]
    working_dir: /app
    command: sh -c "apt-get update -qq && apt-get install -y --no-install-recommends openssl ca-certificates >/dev/null && rm -rf /var/lib/apt/lists/* && npm run dev"
    environment:
      DATABASE_URL: postgresql://shop:shop@db:5432/shop?schema=public
      DATABASE_URL_TEST: postgresql://shop:shop@db:5432/shop_test?schema=public
      NODE_ENV: development
      SESSION_SECRET: dev-secret-change-me-in-prod
      PAYMENT_PROVIDER: stripe
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:3010:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
