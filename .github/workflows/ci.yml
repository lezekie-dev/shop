name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
          POSTGRES_DB_TEST: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shop:shop@localhost:5432/shop?schema=public
      DATABASE_URL_TEST: postgresql://shop:shop@localhost:5432/shop_test?schema=public
      SESSION_SECRET: ci-test-secret
      SESSION_COOKIE_NAME: admin_session
      PAYMENT_PROVIDER: stripe
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed test DB
        run: npx tsx prisma/seed.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run tests/unit
